# Plutus — Weekly Screener.in valuation ratios (PE / PB / Market Cap).
#
# Source decision (2026-09-01): these come from Screener.in on a WEEKLY
# cadence; the daily sync stamps the stored values into each snapshot.
# Saturday 05:00 IST == Friday 23:30 UTC.
#
name: plutus-weekly-ratios

on:
  schedule:
    - cron: "30 23 * * 5"     # Fri 23:30 UTC == Sat 05:00 IST
  workflow_dispatch:
    inputs:
      pool:
        description: "Pool code (blank = ALL)"
        required: false
        default: ""
      limit:
        description: "Symbol cap for smoke runs"
        required: false
        default: ""
      dry_run:
        description: "Compute but do not write"
        required: false
        default: "false"

concurrency:
  group: plutus-weekly-ratios
  cancel-in-progress: false

jobs:
  ratios:
    runs-on: ubuntu-latest
    # ~450 symbols x 15 s cooldown ≈ 2 h of pacing + fetch time.
    timeout-minutes: 240
    env:
      PLUTUS_SUPABASE_URL: ${{ secrets.PLUTUS_SUPABASE_URL }}
      PLUTUS_SUPABASE_SERVICE_KEY: ${{ secrets.PLUTUS_SUPABASE_SERVICE_KEY }}
      SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
      SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
      PLUTUS_SCREENER_COOLDOWN_S: "15"
      PLUTUS_ALERT_WEBHOOK: ${{ secrets.PLUTUS_ALERT_WEBHOOK }}
      PLUTUS_ENV: prod
      PLUTUS_LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: plutus/requirements.txt

      - name: Install dependencies
        run: pip install -r plutus/requirements.txt

      - name: Run weekly ratios sync
        run: |
          ARGS=""
          POOL="${{ github.event.inputs.pool }}"
          LIMIT="${{ github.event.inputs.limit }}"
          DRY="${{ github.event.inputs.dry_run }}"
          if [ -n "$POOL" ]; then ARGS="$ARGS --pool $POOL"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m plutus.scripts.run_weekly_ratios $ARGS

      - name: Notify on workflow failure
        if: failure() && env.PLUTUS_ALERT_WEBHOOK != ''
        env:
          PAYLOAD: |
            {"text":"🚨 *Plutus weekly ratios workflow failed*\nrun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$PLUTUS_ALERT_WEBHOOK" || true
