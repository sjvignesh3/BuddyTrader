# Plutus — Quarterly fundamentals refresh.
#
# Replaces the Render cron `plutus-quarterly-sync`. Runs every Sunday at
# 02:00 UTC — weekly re-check catches late filings without over-fetching.
#
name: plutus-quarterly-sync

on:
  schedule:
    - cron: "0 2 * * 0"       # Sundays 02:00 UTC
  workflow_dispatch:
    inputs:
      pool:
        description: "Pool code (blank = ALL)"
        required: false
        default: ""
      dry_run:
        description: "Compute but do not write"
        required: false
        default: "false"

concurrency:
  group: plutus-quarterly-sync
  cancel-in-progress: false

jobs:
  quarterly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLUTUS_SUPABASE_URL: ${{ secrets.PLUTUS_SUPABASE_URL }}
      PLUTUS_SUPABASE_SERVICE_KEY: ${{ secrets.PLUTUS_SUPABASE_SERVICE_KEY }}
      PLUTUS_ALERT_WEBHOOK: ${{ secrets.PLUTUS_ALERT_WEBHOOK }}
      PLUTUS_ENV: prod
      PLUTUS_LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: plutus/requirements.txt

      - name: Install dependencies
        run: pip install -r plutus/requirements.txt

      - name: Run quarterly sync
        run: |
          ARGS=""
          POOL="${{ github.event.inputs.pool }}"
          DRY="${{ github.event.inputs.dry_run }}"
          if [ -n "$POOL" ]; then ARGS="$ARGS --pool $POOL"; fi
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m plutus.scripts.run_quarterly_sync $ARGS

      - name: Notify on workflow failure
        # Backstop for hard crashes the in-process alerter can't catch —
        # parity with the daily and backup workflows.
        if: failure() && env.PLUTUS_ALERT_WEBHOOK != ''
        env:
          PAYLOAD: |
            {"text":"🚨 *Plutus quarterly sync workflow failed*\nrun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$PLUTUS_ALERT_WEBHOOK" || true
