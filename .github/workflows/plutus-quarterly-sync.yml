# Plutus — Quarterly fundamentals refresh.
#
# Replaces the Render cron `plutus-quarterly-sync`. Runs every Sunday at
# 02:00 UTC — weekly re-check catches late filings without over-fetching.
#
name: plutus-quarterly-sync

on:
  schedule:
    - cron: "0 2 * * 0"       # Sundays 02:00 UTC
  workflow_dispatch:
    inputs:
      pool:
        description: "Pool code (blank or ALL = every pool)"
        required: false
        default: ""
      symbols:
        description: "Comma-separated tickers (e.g. TCS.NS,INFY.NS) — overrides pool"
        required: false
        default: ""
      limit:
        description: "Symbol cap for smoke runs"
        required: false
        default: ""
      dry_run:
        description: "Compute but do not write"
        required: false
        default: "false"

concurrency:
  group: plutus-quarterly-sync
  cancel-in-progress: false

jobs:
  quarterly:
    runs-on: ubuntu-latest
    # Screener.in is the Tier-B source with a 15 s per-symbol cooldown:
    # ~450 symbols ≈ 2 h of pacing + fetch time. GitHub caps a job at 6 h.
    timeout-minutes: 240
    env:
      PLUTUS_SUPABASE_URL: ${{ secrets.PLUTUS_SUPABASE_URL }}
      PLUTUS_SUPABASE_SERVICE_KEY: ${{ secrets.PLUTUS_SUPABASE_SERVICE_KEY }}
      # Screener.in credentials — REQUIRED (data renders only when logged in).
      SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
      SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
      PLUTUS_SCREENER_COOLDOWN_S: "15"
      PLUTUS_ALERT_WEBHOOK: ${{ secrets.PLUTUS_ALERT_WEBHOOK }}
      PLUTUS_ENV: prod
      PLUTUS_LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: plutus/requirements.txt

      - name: Install dependencies
        run: pip install -r plutus/requirements.txt

      - name: Run quarterly sync
        # Inputs via env — never inline ${{ }} inside the script (injection).
        env:
          POOL: ${{ github.event.inputs.pool }}
          SYMBOLS: ${{ github.event.inputs.symbols }}
          LIMIT: ${{ github.event.inputs.limit }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$POOL" = "ALL" ]; then POOL=""; fi
          if [ -n "$SYMBOLS" ]; then ARGS="$ARGS --symbols $SYMBOLS"
          elif [ -n "$POOL" ]; then ARGS="$ARGS --pool $POOL"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m plutus.scripts.run_quarterly_sync $ARGS

      - name: Notify on workflow failure
        # Backstop for hard crashes the in-process alerter can't catch —
        # parity with the daily and backup workflows.
        if: failure() && env.PLUTUS_ALERT_WEBHOOK != ''
        env:
          PAYLOAD: |
            {"text":"🚨 *Plutus quarterly sync workflow failed*\nrun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$PLUTUS_ALERT_WEBHOOK" || true
