# Plutus — Daily OHLCV + snapshot sync + scan.
#
# Replaces the Render cron `plutus-daily-sync`.
# Runs 12:30 UTC (18:00 IST — 30 min after NSE close) Mon–Fri.
#
# Free-tier budget note:
#   * Public repo → unlimited Actions minutes.
#   * Private repo → 2000 min/month free; this job < 5 min ⇒ ~100 min/month.
#
# Money-safety guarantees:
#   * `pip install` is version-pinned via `plutus/requirements.txt`.
#   * The daily sync writes to `sync_jobs` even on failure (partial audit).
#   * The scan is chained with `&&` so a failed sync short-circuits it —
#     never let a partial sync feed a scan.
#
name: plutus-daily-sync

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 12:30 UTC weekdays
  workflow_dispatch:           # manual "Run workflow" button
    inputs:
      pool:
        description: "Pool code (blank = ALL)"
        required: false
        default: ""
      limit:
        description: "Symbol cap for smoke runs"
        required: false
        default: ""
      dry_run:
        description: "Compute but do not write"
        required: false
        default: "false"

concurrency:
  group: plutus-daily-sync
  cancel-in-progress: false     # never cancel a mid-sync run

jobs:
  sync-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLUTUS_SUPABASE_URL: ${{ secrets.PLUTUS_SUPABASE_URL }}
      PLUTUS_SUPABASE_SERVICE_KEY: ${{ secrets.PLUTUS_SUPABASE_SERVICE_KEY }}
      # Optional — leaving blank silently disables alerting.
      PLUTUS_ALERT_WEBHOOK: ${{ secrets.PLUTUS_ALERT_WEBHOOK }}
      PLUTUS_ENV: prod
      PLUTUS_LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: plutus/requirements.txt

      - name: Install dependencies
        run: pip install -r plutus/requirements.txt

      - name: Run daily sync
        run: |
          ARGS=""
          POOL="${{ github.event.inputs.pool }}"
          LIMIT="${{ github.event.inputs.limit }}"
          DRY="${{ github.event.inputs.dry_run }}"
          if [ -n "$POOL" ]; then ARGS="$ARGS --pool $POOL"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m plutus.scripts.run_daily_sync $ARGS

      - name: Run scan (only if sync succeeded)
        if: success()
        run: |
          POOL="${{ github.event.inputs.pool }}"
          POOL="${POOL:-ALL}"
          TODAY="$(date -u +%Y-%m-%d)"
          python -m plutus.scripts.run_scan \
            --pool "$POOL" \
            --as-of "$TODAY" \
            --triggered-by cron

      - name: Verify canary fixtures
        # Always runs — even if the scan failed we still want to know if
        # yesterday's known-good data drifted. `|| true` because a canary
        # drift is reported via alert; the workflow itself does not fail
        # (avoids double-notification alongside the alert webhook).
        if: always()
        run: python -m plutus.scripts.run_canary || true

      - name: Notify on workflow failure
        # Backstop: if the sync CLI crashed hard (exit != 0/1), the
        # in-process alerter never ran. This step covers that gap.
        if: failure() && env.PLUTUS_ALERT_WEBHOOK != ''
        env:
          PAYLOAD: |
            {"text":"🚨 *Plutus daily sync workflow failed*\nrun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$PAYLOAD" "$PLUTUS_ALERT_WEBHOOK" || true
