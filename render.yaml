services:
  # ─── Backend: FastAPI Web Service ─────────────────────────────────────────
  - type: web
    name: buddy-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SCREENER_EMAIL
        sync: false          # You'll fill this in Render dashboard
      - key: SCREENER_PASSWORD
        sync: false          # You'll fill this in Render dashboard
      - key: FRONTEND_URL
        sync: false          # Fill after frontend is deployed
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/pools

  # ─── Frontend: Static Site ─────────────────────────────────────────────────
  - type: web
    name: buddy-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Fill with backend URL after backend is deployed
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
